<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOUFF BANK</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{background:#0a0e1a;color:white;font-family:Arial;text-align:center;padding:40px}
.card{background:#151a2b;padding:30px;border-radius:20px;max-width:350px;margin:30px auto}
button{background:#00d18f;color:#000;padding:18px;width:100%;border:none;border-radius:12px;font-size:20px;font-weight:bold}
input{width:90%;padding:12px;margin:10px;border-radius:8px;border:none}
</style>
</head>
<body>
<h1>🏦 HOUFF BANK</h1>
<p>Real Deposits - Test Mode</p>
<div class="card">
<input id="email" type="email" placeholder="your email" value="tshepho@houff.com">
<input id="amt" type="number" value="1000">
<button onclick="pay()">DEPOSIT NOW</button>
<p id="res"></p>
</div>
<script>
function pay(){
 PaystackPop.setup({
  key:'pk_test_234063c6502ecb0c2a4836f1a5823b1ea830bc67',
  email:document.getElementById('email').value,
  amount:document.getElementById('amt').value*100,
  currency:'ZAR',
  ref:'HOUFF-'+Date.now(),
  callback:function(r){
   document.getElementById('res').innerHTML='✅ SUCCESS!<br>Ref: '+r.reference;
  },
  onClose:function(){document.getElementById('res').innerHTML='Cancelled'}
 }).openIframe();
}
</script>
</body>
</html>
